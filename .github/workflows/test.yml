name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'PR head SHA for status reporting (set by test_trigger.yml)'
        required: false
        default: ''
      pr_number:
        description: 'PR number (passed by main-branch test_trigger.yml; unused here)'
        required: false
        default: ''


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Run the Julia simulation twice, in parallel: as production writes it, for test-online, and with
  # --offline_check, which writes each 3D output as a consecutive-iteration pair, for test-offline-check,
  # whose offline pipeline differences the pairs for its own tendencies (the online TimeDerivative terms
  # need none). --save_sorted adds the validation-only view of the sorted reference state (the two
  # model-grid z✶ methods, the column, ∫E_b), which that job's inv06/inv07 compare against the offline sort.
  # ---------------------------------------------------------------------------
  simulate:
    name: Run simulation (${{ matrix.output }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - output: production
            flags: ""
          - output: offline-check
            flags: --save_sorted --offline_check

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      # The Julia the Manifest was resolved with. This was pinned to 1.12 while Oceananigans' NetCDF grid
      # reconstruction splatted the grid's positional arguments out of an unordered Dict, whose order
      # changed in 1.13; Oceananigans 0.113 keeps them in the order they were written.
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2

      - name: Install Julia packages
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      # Every term of both SFS budgets is written unconditionally; the matrix adds the flags above.
      # The tests find this run through STEM in tests/conftest.py, which has to change with --Nz.
      - name: Run simulation (Nz=512, CPU)
        run: julia --project -t 2 kelvin_helmholtz_instability.jl --Nz 512 --Ri 0.1 --stop_time 70 --Re0 1e-3 --filter_ls 1 7 ${{ matrix.flags }}

      - name: Upload simulation output
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output-${{ matrix.output }}
          path: |
            output/khi_Nz512_Ri0.10.nc
            output/khi_Nz512_Ri0.10_2d.nc
          compression-level: 9
          retention-days: 2

      # The panels animations drawn from the online 2D fields at the end of the simulation, the same
      # figure anim1_panels.py later draws from the same file (animation-online-budgets).
      # The 2D writer is the same in both runs, so one upload is enough.
      - name: Upload online animations
        if: always() && matrix.output == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: animation-online
          path: animations/*.mp4
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Standalone filter test — no simulation needed, runs in parallel.
  # ---------------------------------------------------------------------------
  test-gaussian-filter:
    name: Test Gaussian filter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: pip install -r tests/requirements.txt

      - name: Create output directories
        run: mkdir -p figures

      - name: Run Gaussian filter tests
        id: pytest
        run: pytest tests/test_gaussian_filter.py -v -s

      - name: Upload filter test figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-filter-test
          path: figures/test_gaussian_filter.png
          if-no-files-found: warn
          retention-days: 20

      - name: Update commit status
        if: inputs.head_sha != '' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.pytest.outcome }}' === 'success';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.head_sha }}',
              state: success ? 'success' : 'failure',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: success ? 'Gaussian filter test passed' : 'Gaussian filter test failed',
              context: 'Gaussian Filter Test',
            });


  # ---------------------------------------------------------------------------
  # The budgets as produced: assembled from the simulation's online terms, then the closure and
  # positivity tests. Minutes of Python.
  # ---------------------------------------------------------------------------
  test-online:
    name: Test (online budgets)
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Download simulation output
        uses: actions/download-artifact@v4
        with:
          name: simulation-output-production
          path: output/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: pip install -r tests/requirements.txt

      - name: Create output directories
        run: mkdir -p figures animations postprocessing/output

      - name: Assemble and plot the budgets
        working-directory: postprocessing
        run: bash 00_get_budgets.sh output/khi_Nz512_Ri0.10.nc --filter-scales 1 7

      - name: Run budget closure and positivity tests
        id: pytest
        run: pytest tests/ -v -s

      - name: Install ffmpeg
        if: always() && steps.pytest.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate animations (filter scales 1 and 7)
        if: always() && steps.pytest.outcome == 'success'
        working-directory: postprocessing
        run: |
          for l in 1 7; do
            python anim1_panels.py --filename output/khi_Nz512_Ri0.10.nc --filter-scale $l --dpi 100 --fps 8
          done

      - name: List output files
        if: always()
        run: |
          echo "=== figures/ ==="
          ls -la figures/ || echo "(directory missing)"
          echo "=== animations/ ==="
          ls -la animations/ || echo "(directory missing)"
          echo "=== postprocessing/output/ ==="
          ls -la postprocessing/output/ || echo "(directory missing)"

      - name: Upload budget plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-plots
          path: figures/*.png
          if-no-files-found: warn
          retention-days: 20

      - name: Upload animation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-online-budgets
          path: animations/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Upload budget NetCDF files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postprocessing-output
          path: postprocessing/output/*_integrated.nc
          if-no-files-found: warn
          retention-days: 14

      - name: Update commit status
        if: inputs.head_sha != '' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.pytest.outcome }}' === 'success';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.head_sha }}',
              state: success ? 'success' : 'failure',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: success ? 'All budget tests passed' : 'Budget tests failed',
              context: 'Budget Closure Tests (online)',
            });

  # ---------------------------------------------------------------------------
  # The offline pipeline as a cross-check: postprocessing/offline/ recomputes every term independently
  # (scipy filtering on a padded domain, a numpy sort, an FFT-filtered reference profile) and
  # tests/test_offline_check.py compares each against the assembled online budgets; the inv0* validation
  # scripts of tests/test_online_vs_offline.py run here too. About an hour at this resolution.
  # ---------------------------------------------------------------------------
  test-offline-check:
    name: Test (offline pipeline reproduces the online budgets)
    needs: simulate
    runs-on: ubuntu-latest
    timeout-minutes: 150

    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Download simulation output
        uses: actions/download-artifact@v4
        with:
          name: simulation-output-offline-check
          path: output/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: pip install -r tests/requirements.txt

      - name: Create output directories
        run: mkdir -p figures animations postprocessing/output

      - name: Assemble the online budgets
        working-directory: postprocessing
        run: python 01_online_budgets.py --filename output/khi_Nz512_Ri0.10.nc --filter-scales 1 7

      - name: Run the offline pipeline
        working-directory: postprocessing
        run: N_WORKERS=2 bash offline/run_offline_budgets.sh output/khi_Nz512_Ri0.10.nc --filter-scales 1 7

      - name: Compare offline against online, and run the validation scripts
        id: pytest
        run: pytest tests/test_offline_check.py tests/test_online_vs_offline.py -v -s --offline-check

      - name: List output files
        if: always()
        run: |
          echo "=== figures/validation/ ==="
          ls -la figures/validation/ || echo "(directory missing)"
          echo "=== postprocessing/output/offline/ ==="
          ls -la postprocessing/output/offline/ || echo "(directory missing)"

      # The online-vs-offline comparison figures written by the validation scripts. Uploaded on
      # `always()` so the plots are still there to look at when a comparison fails.
      - name: Upload online-vs-offline validation plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-plots
          path: figures/validation/*.png
          if-no-files-found: warn
          retention-days: 20

      - name: Upload offline budget NetCDF files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postprocessing-output-offline
          path: postprocessing/output/offline/*_integrated.nc
          if-no-files-found: warn
          retention-days: 14

      - name: Update commit status
        if: inputs.head_sha != '' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.pytest.outcome }}' === 'success';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.head_sha }}',
              state: success ? 'success' : 'failure',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: success ? 'Offline pipeline reproduces the online budgets' : 'Offline check failed',
              context: 'Budget Closure Tests (offline check)',
            });

  # ---------------------------------------------------------------------------
  # Combined report — resolves the 'Budget Closure Tests' context that test_trigger.yml sets to pending,
  # so the PR check resolves, then closes any other status still pending on the commit: a commit status
  # never expires, and the trigger runs from main, so a context it named before a rename here would
  # otherwise stay pending on the PR for good and mask the result at a glance.
  # ---------------------------------------------------------------------------
  report:
    name: Report combined status
    needs: [test-online, test-offline-check, test-gaussian-filter]
    runs-on: ubuntu-latest
    if: inputs.head_sha != '' && always()

    permissions:
      statuses: write

    steps:
      - name: Update combined commit status
        uses: actions/github-script@v7
        with:
          script: |
            const on = '${{ needs.test-online.result }}';
            const off = '${{ needs.test-offline-check.result }}';
            const gf = '${{ needs.test-gaussian-filter.result }}';
            const success = on === 'success' && off === 'success' && gf === 'success';
            const sha = '${{ inputs.head_sha }}';
            const post = (name, description) => github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: success ? 'success' : 'failure',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description,
              context: name,
            });
            await post('Budget Closure Tests', success ? 'All budget tests passed' : 'One or more budget tests failed');
            // Every job has finished by now, so a context still pending is a leftover of the trigger and nothing
            // will ever update it; close it with the combined result so the commit's state reads at a glance.
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef,
                                                   { owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const latest = new Map();   // newest first: the first status seen per context is its current state
            for (const s of statuses) if (!latest.has(s.context)) latest.set(s.context, s);
            for (const [name, s] of latest)
              if (s.state === 'pending' && s.creator?.login === 'github-actions[bot]')
                await post(name, `Retired context, closed with the combined result: ${success ? 'passed' : 'failed'}`);

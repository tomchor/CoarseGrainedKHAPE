name: Test Trigger

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    name: Dispatch tests on PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, 'test')

    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: React to trigger comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR branch and SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "branch=$(echo "$PR" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$PR" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"

      - name: Set commit statuses to pending
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: 'pending',
              description: 'Tests dispatched…',
            };
            // Only the combined context is marked pending here. test.yml's jobs post their own contexts when
            // they finish and its report job resolves this one. A per-job name set to pending here would have
            // to match test.yml exactly, and this workflow runs from main, so after a rename on a branch it
            // would stay pending on the PR forever: a commit status never expires. The report job also closes
            // any status still pending on the commit, which covers older copies of this file.
            await github.rest.repos.createCommitStatus({ ...params, context: 'Budget Closure Tests' });

      - name: Dispatch test workflow on PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run test.yml \
            --repo ${{ github.repository }} \
            --ref "${{ steps.pr.outputs.branch }}" \
            -f head_sha="${{ steps.pr.outputs.sha }}"

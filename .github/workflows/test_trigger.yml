name: Test Trigger

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    name: Dispatch tests on PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Anyone can comment on a public repository, and this job runs from main with a write token, so only people with
    # write access start a run.
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, 'test') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: React to trigger comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR branch and SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          # test.yml can only be dispatched on a branch of this repository. A fork's branch name would resolve to our
          # branch of that name, if there is one (a fork's main to our main), and its result would land on the fork's commit.
          if [ "$(echo "$PR" | jq -r '.head.repo.full_name')" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::this PR's branch is in a fork; push it to a branch of this repository to test it"
            exit 1
          fi
          echo "branch=$(echo "$PR" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$PR" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"

      - name: Set commit statuses to pending
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              description: 'Tests dispatched…',
            };
            // Only the combined context is marked pending here. test.yml's jobs post their own contexts when
            // they finish and its report job resolves this one. A per-job name set to pending here would have
            // to match test.yml exactly, and this workflow runs from main, so after a rename on a branch it
            // would stay pending on the PR forever: a commit status never expires. The report job also closes
            // any status still pending on the commit, which covers older copies of this file.
            await github.rest.repos.createCommitStatus({ ...params, context: 'Budget Closure Tests' });

      - name: Dispatch test workflow on PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read from the environment, never pasted into the script: a branch name may contain ", ; and $(...), and
          # pasted in, a crafted one would run as shell commands with this job's token.
          BRANCH: ${{ steps.pr.outputs.branch }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f head_sha="$HEAD_SHA"
